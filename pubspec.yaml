name: crypto_app
description: Crypto market research app using Binance REST/WebSocket, CoinGecko metadata, Node.js and PostgreSQL.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  web_socket_channel: ^3.0.2
  fl_chart: ^0.69.2
  flutter_dotenv: ^5.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/crypto_app_icon.png"
  min_sdk_android: 21
